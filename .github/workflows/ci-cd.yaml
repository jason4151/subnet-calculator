name: CI and deploy

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:
  ci:
    uses: jason4151/gha-shared/.github/workflows/node-docker-ci.yml@main
    with:
      node_version: "22"

  deploy:
    if: github.event_name == 'workflow_dispatch'
    needs: ci
    uses: jason4151/gha-shared/.github/workflows/ecr-eks-deploy.yml@main
    secrets: inherit
    with:
      ecr_repository: lab/subnet-calculator
      cluster_name: lab-eks-cluster
      helm_chart: helm
      namespace: lab
      release_name: subnet-calculator
